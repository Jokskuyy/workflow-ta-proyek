106.9688" x="91.9736" y="439.0498">5. Perbaikan Berulang</text><polygon fill="#ECECEC" points="46.1572,356.793,244.7588,356.793,256.7588,368.793,244.7588,380.793,46.1572,380.793,34.1572,368.793,46.1572,356.793" style="stroke:#555555;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="31.998" x="154.458" y="397.251">Belum</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="188.6016" x="51.1572" y="373.3516">Kriteria fungsi dan integrasi terpenuhi?</text><polygon fill="#ECECEC" points="145.458,478.29,157.458,490.29,145.458,502.29,133.458,490.29,145.458,478.29" style="stroke:#555555;stroke-width:0.5;"/><polygon fill="#ECECEC" points="145.458,181.3965,157.458,193.3965,145.458,205.3965,133.458,193.3965,145.458,181.3965" style="stroke:#555555;stroke-width:0.5;"/><polygon fill="#ECECEC" points="66.1523,522.29,224.7637,522.29,236.7637,534.29,224.7637,546.29,66.1523,546.29,54.1523,534.29,66.1523,522.29" style="stroke:#555555;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="27.9902" x="154.458" y="562.748">Tidak</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="148.6113" x="71.1523" y="538.8486">Masih memerlukan perbaikan?</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="13.9922" x="241.7637" y="526.9492">Ya</text><rect fill="#F2F2F2" height="43.7988" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="268.916" x="11" y="581.29"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="238.916" x="26" y="607.748">Sistem terintegrasi setelah evaluasi dan perbaikan</text><ellipse cx="145.458" cy="656.0889" fill="none" rx="11" ry="11" style="stroke:#222222;stroke-width:1.0;"/><ellipse cx="145.458" cy="656.0889" fil