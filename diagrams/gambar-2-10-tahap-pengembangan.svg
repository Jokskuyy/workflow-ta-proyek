<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="678px" preserveAspectRatio="none" style="width:540px;height:678px;background:#FFFFFF;" version="1.1" viewBox="0 0 540 678" width="540px" zoomAndPan="magnify"><defs/><g><ellipse cx="145.458" cy="20" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1.0;"/><path d="M247.2813,48.1006 L247.2813,67.8994 L227.2813,71.8994 L247.2813,75.8994 L247.2813,95.6982 A0,0 0 0 0 247.2813,95.6982 L455.8789,95.6982 A0,0 0 0 0 455.8789,95.6982 L455.8789,58.1006 L445.8789,48.1006 L247.2813,48.1006 A0,0 0 0 0 247.2813,48.1006 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><path d="M445.8789,48.1006 L445.8789,58.1006 L455.8789,58.1006 L445.8789,48.1006 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="173.2734" x="258.2813" y="69.5586">Tim memetakan masalah pengguna,</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="177.5977" x="258.2813" y="83.3574">batas data, dan kebutuhan tiap peran.</text><rect fill="#F2F2F2" height="43.7988" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="163.6465" x="63.6348" y="50"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="133.6465" x="78.6348" y="76.458">1. Pengumpulan Kebutuhan</text><path d="M232.6035,113.7988 L232.6035,133.5977 L212.6035,137.5977 L232.6035,141.5977 L232.6035,161.3965 A0,0 0 0 0 232.6035,161.3965 L443.5508,161.3965 A0,0 0 0 0 443.5508,161.3965 L443.5508,123.7988 L433.5508,113.7988 L232.6035,113.7988 A0,0 0 0 0 232.6035,113.7988 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><path d="M433.5508,113.7988 L433.5508,123.7988 L443.5508,123.7988 L433.5508,113.7988 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="158.625" x="243.6035" y="135.2568">Antarmuka, data, aset 3D, Unity,</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="179.9473" x="243.6035" y="149.0557">API, dan kontrak integrasi dirancang.</text><rect fill="#F2F2F2" height="43.7988" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="134.291" x="78.3125" y="115.6982"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="104.291" x="93.3125" y="142.1563">2. Perancangan Cepat</text><path d="M268.2725,223.4971 L268.2725,243.2959 L248.2725,247.2959 L268.2725,251.2959 L268.2725,271.0947 A0,0 0 0 0 268.2725,271.0947 L488.2373,271.0947 A0,0 0 0 0 488.2373,271.0947 L488.2373,233.4971 L478.2373,223.4971 L268.2725,223.4971 A0,0 0 0 0 268.2725,223.4971 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><path d="M478.2373,223.4971 L478.2373,233.4971 L488.2373,233.4971 L478.2373,223.4971 " fill="#FAFAFA" style="stroke:#BBBBBB;stroke-width:0.5;"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="165.9316" x="279.2725" y="244.9551">Web dan Denah 2D, data dan aset,</text><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="188.9648" x="279.2725" y="258.7539">serta Unity dibangun sesuai ownership.</text><rect fill="#F2F2F2" height="43.7988" rx="12.5" ry="12.5" style="stroke:#555555;stroke-width:0.5;" width="205.6289" x="42.6436" y="225.3965"/><text fill="#000000" font-family="Times New Roman" font-size="12" lengthAdjust="spacing" textLength="175.6289" x="57.6436" y="251.8545">3. Pembangunan Prototipe per Peran</text><path d="M263.2715,289.1953 L263.2715,308.9941 L243.2715,312.9941 L263.2715,316.9941 L263.2715,336.793 A0,0 0 0 0 263.2715,336.793 L499.9121,336.793 A0,0 0 0 0 499.9121,336.793 L499.9121,299.1953 L489.9121,289.1953 L263.2715,